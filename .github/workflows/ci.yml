name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # macOS is the priority platform (full lint+typecheck+test); Windows runs
    # backend+frontend typecheck/tests too so platform-specific regressions
    # (path separators, process.platform branches) are caught here rather than
    # only at Windows installer build time. Biome is OS-independent formatting,
    # so it only needs to run once — kept on macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Root is bun-managed (bun.lock); npm's stale package-lock is not used.
      - name: Install root deps
        run: bun install

      - name: Install backend deps
        run: cd backend && bun install

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Lint (Biome)
        if: matrix.os == 'macos-latest'
        run: npx biome check .

      - name: Typecheck backend
        run: cd backend && bun x tsc --noEmit

      - name: Test backend
        run: cd backend && bun run test

      - name: Test frontend
        run: cd frontend && npm test
